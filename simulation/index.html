<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container" id="box">
        <!-- Instructions -->
        <div id="myModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close">×</span>
                    <h2>Instructions</h2>
                </div>
                <div class="modal-body">

                    <p>
                    <ol type="1" style="font-size: 18px;color:black">
                        <li>Select the desired <b>Data Type</b>.</li>
                        <li>After selecting, click on <b>SUBMIT</b> button.</li>
                        <li>Now, click on <b>CREATE</b> tab to start the simulation.</li>
                    </ol>
                    </p>

                </div>
                <div class="modal-footer">
                    <br>
                </div>
            </div>
        </div>

        <!-- header -->
        <header class="header">
            <div class="tabs">

                <!-- tabs -->
                <div id="tab-1" style="display: flex; border-right: 2px solid black; color: white;cursor:not-allowed;">
                    <div class="tab-create" id="tab-create" style="cursor:not-allowed;">
                        <a class="tab-text" id="todecide" > CREATE</a>
                    </div>
                  
                        <img id='createimg' src="images/create.png"
                            style="margin-top: 3px; margin-right: 10px; height: 85%;cursor:not-allowed;" alt=""></button>

                </div>
                <div id="tab-2" style="display: flex; border-right: 2px solid black; color: white;cursor:not-allowed;">
                    <div class="tab-create" style="cursor:not-allowed;">
                        
                       COMPUTE
                    </div>
                    <img src="images/calculator.png"
                        style="margin-top: 3px; margin-right: 10px; height: 85%;cursor:not-allowed;" alt="">
                </div>
                <div id="tab-3"
                    style="display: flex; border-right: 2px solid black; color: white; cursor:not-allowed;">
                    <div class="tab-create" style="cursor:not-allowed;">
                        ANALYZE
                    </div>
                    <img src="images/analyse.png" style="margin-top: 3px; margin-right: 10px; height: 85%" alt="">

                </div>
            </div>
            <a class="header-text" id="myBtn" style="padding-top: 8px" href="#">INSTRUCTIONS</a>
        </header>
        <body>
            <div style="margin-top: 2.5in; margin-left: 0in;">
                <center>
            <h2>Select the data type:
                <select style="font-size: medium;" class="inp" id="nvalue">
                    <option value="NULL" >NULL</option>
                    <option value="1" >Continuous data</option>
                    <option value="2">Categorical data</option>
                   
            </select>  <button class="button" onclick="Submit()" id="submit-button" style="font-size:15px; width: 100px; margin-left: 0.3in;"><b>SUBMIT</b> </button></h2>
            </center>
            
        </div>

        <script src="../assets/js/iframeResize.js"></script>
        
        </body>




        <!-- footer -->
        <footer class="footer">
            <span class="footer-text">© 2025 Virtual Labs, IIT Roorkee</span>
        </footer>

    </div>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.js"></script>
    <script>
        function Submit(){
            

        const myContainer = document.getElementById('box');
        Swal.fire({
            icon: 'info',
            html: 'Click on the <b>CREATE</b> tab.',
            allowOutsideClick: false,
            customClass: {
                container: "swal-container",
                popup: "swal-popup",
                title: "swal-title",
                content: "swal-content",
            },
            target: myContainer,
            didOpen: () => {
                const container = document.querySelector('.swal-container');
                const containerWidth = myContainer.offsetWidth;
                const containerHeight = myContainer.offsetHeight;

                if (containerWidth >= 1000 && containerHeight >= 672) {
                    container.style.fontSize = '24px';
                } else {
                    container.style.fontSize = '16px';
                }

              
                container.style.position = 'absolute';
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.top = '0';
                container.style.left = '0';
                container.style.padding = '0';
                d=document.getElementById("nvalue").value
                if(d=='1'){
                    g=document.getElementById("todecide")
                    g.href="trainingcont.html"
                    document.body.getElementsByClassName("tab-create")[0].style.cursor = "pointer";
                    document.getElementById('createimg').style.cursor ="pointer";
                    document.getElementById('tab-1').style.cursor ="pointer";
                    
                    document.getElementById('tab-1').onclick = function() {
    // Call the function to navigate to another page
    navigateToPage('trainingcont.html');
  };
  document.getElementById('tab-create').style.cursor ="pointer";
                    document.getElementById('tab-create').onclick = function() {
    // Call the function to navigate to another page
    navigateToPage('trainingcont.html');
  };
                }
                if(d=='NULL'){
                    Swal.fire({
      icon: 'error',
      title: 'DataType Required',
      text: "First select DataType to proceed.",
      showCancelBotton:true,
      allowOutsideClick: false,
      target: '.container',
      customClass: {                      // <------ customClass is an object!
        container: 'position-absolute'
      },     
    });
                }
                if(d=='2'){
                    g=document.getElementById("todecide")
                    g.href="training.html"
                    document.body.getElementsByClassName("tab-create")[0].style.cursor = "pointer";
                    document.getElementById('todecide').style.cursor ="pointer";
                    document.getElementById('tab-1').style.cursor ="pointer";
                    document.getElementById('tab-1').onclick = function() {
    // Call the function to navigate to another page
    navigateToPage('training.html');
  };
                    document.getElementById('tab-create').style.cursor ="pointer";
                    document.getElementById('tab-create').onclick = function() {
    // Call the function to navigate to another page
    navigateToPage('training.html');
  };
                    document.getElementById('createimg').style.cursor ="pointer";
                }

            },
        });}
        
        function navigateToPage(pageUrl) {
    // Redirect the user to the specified page
    window.location.href = pageUrl;
  }

        
        const pageAccessedByReload = (
  (window.performance.navigation && window.performance.navigation.type === 1) ||
    window.performance
      .getEntriesByType('navigation')
      .map((nav) => nav.type)
      .includes('reload')
);
if(pageAccessedByReload==true){
    window.location.href="index.html"
}</script>

</body>

</html>
